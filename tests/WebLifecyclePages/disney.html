<!doctype html><meta charset="utf-8"><title>Disney Test</title><style>body{background:#10236a;color:white;font:32px Segoe UI;padding:60px}small{font-size:15px;display:block;margin-top:25px;max-width:900px}button{padding:14px 20px;border:0;border-radius:10px;font:18px Segoe UI;cursor:pointer}</style><h1>DISNEY TEST PAGE</h1><p id="launch"></p><button id="fullscreen">Test website fullscreen</button><small id="fullscreenState">Website fullscreen: no</small><small id="ua"></small><script>let n=+(localStorage.launches||0)+1;localStorage.launches=n;launch.textContent=`Profile launches: ${n}`;ua.textContent=navigator.userAgent;fullscreen.onclick=()=>document.documentElement.requestFullscreen();document.addEventListener('fullscreenchange',()=>fullscreenState.textContent=`Website fullscreen: ${document.fullscreenElement?'yes':'no'}`);</script>
